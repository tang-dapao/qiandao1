  # 效果：段5 回到 ~1s 级且**零 OCR**（P0 的提前复核因 dump 命中而不触发，连带
  # 省掉其 ~1.8s/台）；E 与 P0 是分层关系：E 命中则 P0 静默，E 打空（未来版式再变）
  # 时 P0 仍在 2 台后接管兜底。
  # 慢加载 / 旧版式不受影响（新词表是旧词表的**超集**，只可能更早命中）；错页安全性
  # 不降级（命中仍要求 TC 特征词，机器人列表 / 资料卡 / 聊天页逐页取证 0 命中）。
  # false = 一键回退旧判据（只认任务行 + 广告行）。
  enter_ready_shell_keys: true
  # P4（2026-10-21 官方版式改版）：进台后预滑一次，把「任务中心」滑进可见区。
  # 新版个人页在顶部新增了头像区/聊天特权卡，任务中心卡片被推到**页面最下面**，
  # 进台初始视口看不到任务行（用户实测确认「任务中心在最下面，滑动到底部可见」）。
  # 实测代价：段6 配额读屏 p50 1.60 → **3.10s**（n=22，分布极窄 = 确定性多一步）；
  # 段5 不受影响（外壳特征「收支详情」仍在首屏，p50 0.90s 不变）。
  # 段6 原来三步：① nodes() 空 dump（视口内必找不到，~1.2s）
  #              ② swipe_up() 固定 800px + 硬等 pause=1.0s
  #              ③ nodes() 再 dump → 命中（~0.9s）
  # 本项把①省掉（`_tc_entry_ratio is None` 就是「在可见区外」的精确信号，与段5
  # 同快照同判据），并把②换成 **一次 1600px 长滑**（`ui.swipe_up_far`，d300/p0.30）。
  # 真机 A/B（2026-10-21，probe_preswipe6~9，n=3~9 每策略）：
  #   800px ×1（初版）   ：内部又滑 3/3 → 实际退化成 2 次，段6 3.24s
  #   800px ×2           ：段6 1.69s
  #   1600px ×1（本项）  ：段6 **0.84s**（预滑 0.70 + 读 0.13）← 生产代码实测 n=5
  # 三组落位完全一致（广告行 y=1653-1710，cy<1740 均在安全点击区，0/3 越界）
  # ⇒ **省 2.40s/次**，382 次/天 ≈ **15.3 min/天**。
  # 兜底：长滑后仍看不到任务行时 _find_row 按原逻辑双向继续滑（最坏与改动前持平）。
  # false = 一键回退（段6 仍能用，只是恢复 3.1s 的空 dump + 硬等）。
  enter_preswipe_bottom: true
  # 2026-10-21 P4-b：签到/反馈找行**未命中**时的兜底 —— 补一次 1600px 长滑到底
  # 再重找一次。成功路径零成本（只在 miss 分支付出 0.45s + 一次 dump）。
  # 依据：任务行在个人页最下面，`_find_row` 的兜底滚动是通用「800px/步 + pause=1.0」
  # 翻页语义（机器人列表共用，不能整体换成长滑）；miss 后长滑一步基本必中。
  # 同时段5 心动卡恢复的 2×800px 上滑也一并换成 swipe_up_far（~2.8s → ~0.9s）。
  # false = 回退为「miss 即返回 None（判失败）」。
  task_row_fallback_far: true
  # 2026-10-22 A+B：官方「新玩法/新功能上线」一次性弹窗的**文案锚点词表**。
  # 背景（坑 18 / F12）：官方推新功能时会在任务中心 H5 之上盖一个弹窗，任务行
  #   全被遮挡；不关掉 → 段5 探不到任务行 → 3 次进台重试全败 → 轮换链判本组
  #   弃权，该台本轮 10 支配额全丢。旧实现锚 `"已经上线"`（子串匹配），而
  #   2026-10-22 新版标题是「全新玩法**已上线**」（少一个「经」）→ 恒不匹配 →
  #   静默跳过（一个动作都不做）。故改为词表 + 补专属 CTA「去体验」。
  # 判据 = 精确「关闭」节点 **且**（本表任一命中）→ 双特征不变，防误关性质不变；
  #   点击仍走 dump 节点 `_tap_node`，**不引入任何坐标盲点**（符合 F11）。
  # 成本：无弹窗时仅多 1 次 `_find("关闭")` 的 dump（u2 ~0.1s，0.8s TTL 内复用），
  #   且「关闭」缺失即短路、不扫本表；命中关闭时 +1.5s 沉降 + 最多 1 次重试。
  # 前置条件：✕ 必须在 dump 里有 text/content-desc（09-25 旧版实测为 `text="关闭"`；
  #   新版按截图推算位置几乎重合，但**尚未真机确认**）。若读不到，只会不动作，不会误点。
  # 回退：设成 ["已经上线"] 即恢复 2026-09-25 行为（不认新文案、不认「去体验」）。
  newfeat_anchors:
    - "已经上线"
    - "已上线"
    - "全新玩法"
    - "玩法上线"
    - "去体验"
  # 2026-10-12 P2（方案 F）：OCR 取图**优先走感知后端原生通道** ——
  # u2 的 screenshot_pil（设备端 :9008 直取 PNG）实测 0.07~0.17s，对比
  # adb exec-out screencap 的 0.46~0.50s 快约 5x（probe_f_ocr.py 实测）。
  # 取图是全流程最高频 I/O（_dismiss_badcase / _close_ad / _fullscreen_scan* /
  # _ocr_find 全部经 flow._ocr_shot），省下的 ~0.4s 会按调用次数放大。
  # 图像尺寸与色彩空间与 adb 路径完全一致（1080x1920 RGB）。
  # 感知后端为 adb（无 screenshot_pil）/ 通道抛异常 / 返回 None → **自动静默
  # 回落 adb 原链路**，本旋钮只影响「是否优先尝试原生通道」。
  # false = 一键回退纯 adb 取图。
  ocr_shot_via_u2: true
  # 2026-10-08 P1：F9/坑 15 **让位后落点复核** —— 上滑让位改变列表版式，目标行
  # 可能被滚入吸顶分类栏下缘的回收残影槽位（坑 15：点该槽位坐标会命中分组头
  # → 列表被折叠 → 4 台连环弃权）。让位后用新 dump 复核「同名机器人行仍在 +
  # 仍在安全点击区(cy/y2<=TAP_Y_MAX) + 未贴吸顶栏」，任一不过则放弃本次点击交
  # 上层复位重试。仅「确实让位过」时付一次 dump；未让位的成功路径零开销。
  enter_landing_recheck: true
  # 2026-09-29 电量统计：每账号「本流程获得电量」= 第一台机器人首次进台读的
  # 「当前电量」→ 广告全部看完后补一次进台读的终值，差值计入汇总文件。
  # 结束快照需补一次进台（~20s/账号），主路径零额外读屏。false = 关闭统计。
  energy_stat: true
  # 2026-11-10 用户需求（宿主内存爆满）：**账号间内存回收 + RSS 观测**。
  # 背景实测：宿主物理内存仅 3.92GB、可用 0.3GB；MuMu guest 固定 2GB
  # （vms/MuMuPlayer-15.0-0/configs/vm_config.json memory=2）。逐账号跑 5~6 小时，
  # 缓存（截图 / OCR 坐标 / dump 节点 / 关闭按钮预定位）跨账号累积会加剧换页。
  # true  = 每账号结束清可再生缓存 + gc.collect()，并打一行
  #         `[内存] RSS X MB → Y MB（±N MB）` 供判断是否真累积。
  # false = 只观测不清理（一键回退，用于 A/B 对比回收是否有效）。
  mem_release: true
  # 2026-09-29 方案 A（游迦 9/10 虚报实锤）：连看会话末支「关闭路径可疑」
  # （_close_ad 未点到任何关闭按钮、仅凭 OCR 判已回任务中心）时，收尾 break
  # 前真实读屏复核配额，不符则按屏幕真值校准继续补看。正常关闭路径零额外
  # 读屏，不影响点击效率。false = 回退旧行为（不复核）。
  ad_end_verify: true
  # 2026-09-25 官方改版：问题反馈页需填写反馈内容才能提交。true = 启用自动
  # 反馈，内容为 5 位随机数；false = 回退旧行为（进页不填写直接返回）。
  # ⚠️ 官方按「账号+内容」去重（2026-09-26 用户实测：同账号内只要输入过一次，
  # 往后同内容全部被拒，toast「反馈内容重复了」不进 dump）→ 内容用 5 位随机数，
  # 每次生成前排除历史已用并追加记录到 state/feedback_used.txt（跨进程永久不用）。
  feedback_fill: true
  # 已用反馈内容记录（业务状态，2026-11-09 由 logs/ 迁出）。
  # 置空字符串 = 不落盘、不排除历史（仅供单测/调试，生产必须保留）。
  feedback_used_file: "state/feedback_used.txt"
      # 机器人白名单（2026-09-09 用户维护）：仅对名单内昵称执行签到/问题反馈/看广告，
  # 其它一律跳过。QQ 中无法操作的（昵称重复：小麦1/小麦2、孤立“1”、内测中等）
  # 已排除在名单外。后续增删机器人直接编辑此列表；清空 = 不过滤（跑全部）。
  robot_whitelist:
    - 小麦
    - 尔尔
    - 席恩
    - 代柯
    - 游迦
    - 藤非
    - 古禹
    - 裴旖
    - 李宥恩
    - 黎小姐

# ------------------------------------------------------------
# 多账号自动切换（2026-09-24 新增）
# ------------------------------------------------------------
# 背景：一台模拟器里 QQ 登了 4 个账号（QQ 自带多账号列表），希望主流程
# 跑完一个账号自动切到下一个继续跑。
#
# 实测（2026-09-24 真机 dump + 截图，非臆测）：
#   切号路径 = 联系人页左上角「账户及设置」→ 侧栏「切换账号」→ 账号列表弹窗
#   → 点目标账号行；**免密秒切**，单次 ~8.5s，无密码/验证码（4/4 成功）。
#   - 账号列表每项为「昵称 + UIN」两行 dump 节点，**UIN 唯一稳定**；
#   - ⚠️ 列表顺序会变（当前登录账号置顶）→ 实现按 UIN 文本定位，禁止记坐标；
#   - ⚠️ 各账号机器人列表**不同**（唐灵 12 / 王 11 / 觅夏 13）→ 白名单
#     沿用上面 workflow.robot_whitelist（全局一份），该账号没有的名字自动跳过；
#   - ⚠️ 切号后**首次收集机器人必漏列表顶部若干行**（实测唐灵 7 vs 12、
#     觅夏 10 vs 13；数据加载期 Phase1「连续 2 屏不变」被误判为已到顶）
#     → 实现用「连续 2 次收集结果一致」判就绪后才采纳。
#
# 生效范围：**仅完整主流程**（py -3.13 main.py / --rotate）。--no-ad /
# --ad-only / --robots 手动指定 时保持单账号旧行为不变（一行代码回退：
# accounts.enabled: false）。
accounts:
  enabled: true
  # 切号成功后基础沉降（秒），再开始校验/收集（宁长勿短，防加载未完成）
  settle: 2.0
  # 单次切号失败的重试次数（网络/页面抖动自愈）
  max_retry: 2
  # 数据就绪判定：连续 N 次收集结果完全一致才采纳
  ready_stable: 2
  # 数据就绪判定最长等待（秒），超时用末次结果并告警
  ready_timeout: 120.0
  # 账号面板滚动查找（2026-10-30）：账号加到 5 个后，「切换账号」面板一屏装不下，
  # 最后一行经常只露出**昵称**、UIN 行被视口切出 a11y 树（实测 10-30 11:37 王账号
  # 失败现场：唐六爻/凌津渡/唐灵/觅夏 的 昵称+UIN 成对在树上，第 5 个只有
  # '王'@(262,1250)，UIN 1766775822 根本不在 dump 里）。
  # ⚠️ 这类缺失**不是加载慢**，`_wait_for_text` 等多久都不会出现，必须滚动。
  # 仅在首屏未命中时才滚动（成功路径零成本），最多拖 row_scroll_rounds 次。
  # ⚠️ 拖动坐标有硬约束（2026-10-30 真机探针标定）：「切换账号」面板是**居中
  #    对话框**，5 个账号时列表视口 y≈582~1270（行距 162px，王的昵称 1230-1270，
  #    其 UIN 应在 1301-1353 被视口底部切掉）。起点一旦落到视口外（例如
  #    y=1440，`swipe_up()` 的固定起点 y=1500 更是如此）→ 手势被 ROM 当成
  #    「点面板外关闭」→ 面板消失、切号必失败（v2/v4/v7b 探针各复现一次）。
  #    实测可用几何：从列表内 (540,1210) 往上拖到 (540,910) / 700ms →
  #    王的 UIN 出现在 y=1198-1250，面板保持打开（v8 候选 A ✓，2.3s 含采样）。
  #    起点 1210 落在「唐灵 UIN 行底 1191」与「王 昵称行顶 1230」之间的空隙，
  #    不在任何账号行上，也不会误触切号。
  #    账号继续增加时优先加大 row_scroll_rounds（每次 ≈ 上移 111px 可见内容）。
  # 一键回退：row_scroll: false → 恢复「首屏找不到就判失败」的旧行为。
  row_scroll: true
  row_scroll_rounds: 2
  row_scroll_x: 540
  row_scroll_from_y: 1210     # 必须在列表视口内（582~1270），否则面板会被关掉
  row_scroll_to_y: 910
  row_scroll_duration_ms: 700 # 宁慢勿快：600~700ms 是「拖」，更快容易被当 fling
  # 账号清单 —— 列表顺序即执行顺序
  #   nick = QQ 昵称（用于切号后校验）
  #   uin  = QQ 号（唯一标识，切号定位依据）
  # ⚠️ 脱敏说明（2026-10-21）：本文件随仓库公开，因此 uin 一律写**占位号**
  #   1000000001~1000000004。真实 QQ 号保存在本机 `accounts.local.yaml`
  #   （已在 .gitignore 排除），main.py: load_config() 会用它的 accounts.*
  #   覆盖本块（按「键」覆盖，enabled/settle 等仍取这里）。没有该文件时
  #   （他人克隆）需自行填 uin，否则切号会因定位不到账号而失败。
  list:
    - nick: "唐六爻"
      uin: "1000000001"
      enabled: true
    - nick: "王"
      uin: "1000000002"
      enabled: true
    - nick: "觅夏"
      uin: "1000000003"
      enabled: true
    - nick: "唐灵"
      uin: "1000000004"
      enabled: true

# ------------------------------------------------------------
# 点击频率控制（防风控）
# ------------------------------------------------------------
timing:
  # 两次点击之间的随机间隔区间（秒）
  click_min: 1.5
  click_max: 3.0
  # 页面切换后的等待时间（秒）
  page_wait: 2.5
  # A1（2026-09-12）：导航 tap 后「事件驱动等待」的目标超时（秒）——轮询
  # 页面真正到达目标状态即继续，页面就绪快时省时间（完整导航 50s→30s）。
  # 该值会自动 max(此值, page_wait)，保证最坏等待不短于旧固定等待。
  nav_wait: 8.0
  # 进入个人页后等待任务中心刷新的时间（秒）
  taskcenter_wait: 3.0
  # 广告页关闭后等待返回任务中心的时间（秒）
  # A 优化（2026-09-13 用户确认）2.0→1.0：关闭生效已有 settle+确认链路兜底，
  # 轮转循环随后还有配额检查；异常回调 2.0。
  ad_close_wait: 1.0
      
# ------------------------------------------------------------
# OCR 配置
# ------------------------------------------------------------
ocr:
  engine: "pytesseract"          # 目前仅支持 pytesseract
  tesseract_cmd: "C:\\Program Files\\Tesseract-OCR\\tesseract.exe"
  # 识别语言: chi_sim=简体中文, eng=英文; + 表示组合（中英混合识别）
  lang: "chi_sim+eng"
  # 识别文字时的置信度阈值（0~100），低于此值视为未命中
  confidence: 60
  # 识别时是否放大截图（提高小字识别率）
  scale: 2.0

# ------------------------------------------------------------
# 日志
# ------------------------------------------------------------
logging:
  level: "INFO"                  # DEBUG / INFO / WARNING / ERROR
  file: "logs/run.log"

# ------------------------------------------------------------
# 异常告警（2026-10-23 新增 · 多通道，默认企业微信）
# ------------------------------------------------------------
# 背景：官方版式/活动/广告样式变动无法第一时间人工知晓，需要程序在跑的时候
# 自己识别「和预期不一样」并记录 + 实时推微信。
# 凭据不在这里：各通道 token/secret 放 notify.local.yaml（已 gitignore）。
# 支持通道：
#   wecom_app  企业微信自建应用（⚠️ 需先配「企业可信IP」，而配可信IP 又要求
#              先有可信域名或接收消息服务器URL → 无自有域名时此路走不通）
#   wecom_bot  企业微信群机器人 webhook（无 IP 限制，但「全员群」不支持，
#              必须是普通内部群/外部群）
#   pushplus   个人微信推送（https://www.pushplus.plus 扫码拿 token，最省事）
#   serverchan Server酱（免费 5 条/天，仅作备份）
# 自检命令：py -3.13 notify.py --check / --test / --ip
# 一键关闭：enabled: false（仅落盘 logs/anomaly.jsonl，不推送）
notify:
  enabled: true
  # 主通道。凭据缺失的通道会被自动跳过
  # 2026-10-23 实测：自建应用被「可信域名」前置条件卡死 → 改用群机器人
  channel: "wecom_bot"
  # 降级链：主通道发送失败时依次尝试（同一个告警只成功推一次）
  fallback: []
  # 应用消息接收人：@all = 应用可见范围内全部成员（当前就你自己）
  touser: "@all"
  # 每个账号跑完推一条统计（2026-10-23 用户需求）：耗时 + 本账号获得电量 +
  # 机器人/签到/反馈/广告计数。多账号模式逐账号推，单账号模式收尾推一条。
  # false = 关闭（异常告警不受影响）。
  account_summary: true
  # 单次 HTTP 超时（秒）。告警在后台线程发送，阻塞不影响主流程。
  timeout: 5.0
  # ---- 推送失败重试 + 待补发队列（2026-10-30 新增）----
  # 背景：10-30 当天真丢过 2 条 —— 13:18「连续 3 支广告没打开」、
  # 14:08「✅ 账号 觅夏 第 2/4」，原因都是 qyapi.weixin.qq.com 读超时 5s，
  # 而 fallback 是空的 → 一次超时整条就丢了（只在 anomaly.jsonl 留了记录）。
  # 现在：网络层异常（Timeout/ConnectionError）重试，配置类异常
  # （errcode / webhook 失效 / IP 未授信）不重试（重试不会变好）。
  send_retries: 2          # 额外重试次数（0 = 只试一次，回到旧行为）
  retry_backoff: 2.0       # 两次尝试之间等待（秒）
  retry_timeout: 10.0      # 重试时把单次 HTTP 超时抬到多少
  # 全部通道仍失败 → 转存待补发队列；主流程收尾 flush() 时补发一次。
  # 手动补发：py -3.13 notify.py --resend
  # 业务状态，2026-11-09 由 logs/ 迁出（丢了 = 告警永久丢失，需独立备份）。
  pending_file: "state/notify_pending.jsonl"
  resend_max: 5            # 收尾补发最多几条（每条只试一遍，避免拖慢退出）
  # 同类异常去重窗口（秒）：同一 dedup_key 在窗口内只推一次（跨进程持久化）
  # 目的：官方改版时一晚上几百次同类命中，不能每条都推。
  dedup_window: 1800
  # 每小时推送上限（条）。溢出只计数，下一条正常消息附带「已抑制 N 条」。
  max_per_hour: 40
  # 异常结构化记录（JSON Lines，无论推送成功与否都写）
  record_file: "logs/anomaly.jsonl"
  # 现场截图落盘目录
  shot_dir: "screenshots/anomaly"

# ------------------------------------------------------------
# 自探测（2026-10-23 新增 · 官方变动识别）
# ------------------------------------------------------------
# 现有判据命中时顺路记账；连续异常超阈值才推微信（单次抖动不打扰），
# 成功一次即清零。所有钩子内部吞异常，失败绝不影响签到主流程。
# 落地位置：logs/anomaly.jsonl（结构化）+ screenshots/anomaly/（现场图）
watch:
  enabled: true
  # 连续 N 台「进台重试 3 次仍失败」→ 判官方版式/弹窗变化（单台抖动不报）
  enter_block: 2
  # 连续 N 支广告异常（关不掉 / 没打开 / 找不到入口行）→ 判广告版式变化
  ad_fail: 3
  # 连续 N 次签到或反馈失败 → 判任务行/按钮文案变化
  task_fail: 3
  # 弹窗告警是否附现场截图（未知弹窗默认附，便于人工比对）
  popup_shot: true
