  # false = 一键回退旧行为（段5 走 _find 轮询、段6 独立读屏）。
  tc_ready_by_quota: true
  # 2026-10-08 P1：进台**落点断言** —— 段5 探不到任务行时做一次 OCR 判别：
  #   读到任务中心特征        = H5 慢加载 → 放行（与旧行为一致）；
  #   读到错页特征（_LANDING_WRONG_KEYS = 发送/语音通话/QQ空间/资料卡/相册/
