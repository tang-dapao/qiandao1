  # 总窗口不变）。false = 一键回退旧行为。
  nav_fast_wait: true
  # P1（2026-10-19）：退台「三层 BACK 连发 + 尾一次校验」快路径。
  # 实测依据（probe_exit_timing，3 trial）：3 次 BACK 之后 0.07~0.08s 列表就能被
  # 「机器人」分类 selected + 联系人 tab 的强判据正确检出；而**前两层** BACK 后
  # 3.5s 窗口内 20 次检查全不命中 ⇒ 逐层校验的价值只在最后一层，前两层的
  # pause(0.8~1.2s)+dump（每层 ~1.1s）是纯盲等。
  # 连发后：3×pause(0.15~0.30) + 1 次 dump ≈ 0.8s（原 ~3.3s），省 ~2.5s/次。
  # ⚠️ 连发失败（BACK 被吞/页面未到位）→ 自动回落原逐层链，兜底语义完全不变，
  #   只是多花连发那 ~0.7s。false = 一键回退纯逐层校验（旧行为）。
  exit_back_burst: true
  # 2026-09-29 P1b 进台点击 pause 收紧（仅进台，全局 timing.click_min/max 不动）：
  # 诊断实测（09-29 王 92 轮 / 唐六爻 91 轮进台打点）——进台 9.5s 里 6.75s（70%）
  # 是「点机器人行 / 点发消息 / 点个人」三处 _tap_node 后的固定 pause 空等，其
