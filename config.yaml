  enter_early_ocr: true
  # 提前复核前先等待的轮数（每轮 0.5s）。默认 4（≈2.0s）—— 覆盖实测页面渲染
  # 耗时上限（10-09/10-10 dump 命中中位 1.9s），避免在渲染完成前白扫一次。
  enter_early_ocr_polls: 4
  # 2026-10-12 P1（方案 E）：段5 dump 就绪判据**对齐 OCR 判据** —— 在「任务行」
