# ============================================================
# 自动签到 + 看广告 配置
# 目标: QQ (com.tencent.mobileqq) 机器人任务中心
# 注意: 所有坐标基于固定的模拟器分辨率，改动分辨率需重新抓取
# ============================================================

device:
  # MuMu 模拟器 adb 序列号
  # MuMu 有两个 adb 入口：
  #   - emulator-5554：MuMu 底层 QEMU 内核，adb server 自动发现，daemon 重启自动重连（稳定，推荐）
  #   - 127.0.0.1:16384：MuMu 网络 adb 转发端口，需手动 `adb connect`，daemon 重启会丢
  # 实测本机 MuMu（机型模拟小米 12 / cupid）稳定入口为 emulator-5554
  udid: "emulator-5554"
  # 感知层后端（阶段2 2026-09-15）：
  #   adb = 原 adb uiautomator dump（默认，2.4-3.8s/次）
  #   u2  = uiautomator2 3.x 设备端常驻 agent（实测中位 94ms，42.6x 提速）
  # 互斥警告：u2 agent 常驻时 adb uiautomator dump 100% 被 SIGKILL(rc=137)。
  # u2 进程退出时自动 stop agent 让出通道；若手动 kill 进程残留 agent，
  # 执行 `py -3.13 -m uiautomator2 -s emulator-5554 stop` 或重启模拟器。
  # 阶段1 探针：scripts_test/probe_u2.py；设备端资源安装：`py -3.13 -m uiautomator2 init -s <udid>`
  backend: "u2"
  platform: "Android"
  platformVersion: "15.0"        # MuMu 12 = Android 15
  noReset: true                  # 不重置应用数据（保持已登录状态）

app:
  package: "com.tencent.mobileqq"
  activity: "com.tencent.mobileqq.activity.SplashActivity"

# ------------------------------------------------------------
# 业务状态目录（2026-11-09 目录整理）
# 与 logs/ 严格分离：
#   logs/  = 诊断输出（run.log / summary_*.txt / anomaly.jsonl）→ 可随时清空
#   state/ = 持久业务状态 → 删了会出事故，需独立备份，不入 git
# 归属 state/ 的四个文件（迁移前都在 logs/ 下）：
#   feedback_used.txt      反馈内容去重窗口（丢了 → 官方判重复，反馈全被拒）
#   notify_pending.jsonl   待补发告警队列（丢了 → 告警永久丢失）
#   notify_state.json      告警去重窗口 + 每小时限流计数
#   wecom_token.json       企微 token 缓存（丢了自愈，仅多一次换取）
# 迁移时间：2026-11-09，代码侧 flow.py / notify.py 默认值已同步。
# ------------------------------------------------------------
state:
  dir: "state"

# ------------------------------------------------------------
# 流程控制
# ------------------------------------------------------------
workflow:
  # 每个机器人看广告的次数
  ad_times_per_robot: 10
  # 看广告时在广告页停留的随机区间（秒）：
  # 15-17s 覆盖 ≤15s 视频广告 + 页面加载延迟（2026-09-13 用户确认第三轮收紧；
  # 原 20-23s → 18-20s → 16-18s → 15-17s），等待结束进入 _close_ad：
  # uiautomator 优先直关，视频未播完时 dump 有界失败后转 OCR 正向定位。
  # ⚠️ 已贴 15s 视频底线：真机验证看广告计数仍增长方可保留，异常则回调 16-18。
  ad_wait_min: 15
  ad_wait_max: 17
  # 2026-10-22 N1：「试玩小游戏」广告版式（官方新上线）。
  # ⚠️ 占比**不是固定比例**：10-22 生产实锤它是「时间窗爆发」——
  #    12:46~12:58 这 12 分钟里 9/20 支是试玩，而同日 11:51~12:42 的 87 支、
  #    13:00~13:52 的 98 支**各 0 支**。别再用「≈22%」做预算，也别用
  #    「采样半小时没命中」判定版式消失。
  # 这类广告点开后**停在落地页**（`小游戏体验` + `点击进入` + `还需体验 15 秒`），
  # 视频根本不播；**必须点「点击进入」跳转后 15s 计时才开始**（用户确认 + 实测：
  # 在落地页干等 18s 文案纹丝不动；不点进入直接按返回 → 直接回任务中心、无奖励）。
  # 跳转后（模拟器未装微信）= 微信小程序授权页，静止 15s 后连续点两次「返回」：
  # 授权页 →（返回）→ 试玩奖励页（`恭喜获得奖励`，**这页没有「关闭广告」**）→
  # （返回）→ 任务中心，配额 +1、电量 +16（古禹 11:29 实测 1/10→2/10）。
  # 判据全程 dump 节点（ad 页 dump 实测 0.05s），**零 OCR、零坐标盲点**。
  # 成本：探针 2 次 ≈0.1s 且从 ad_wait 里扣除 → 普通广告成功路径总时长不变。
  # false = 一键回退（试玩广告退回 BACK 兜底，拿不到奖励）。
  ad_minigame: true
  # 小程序页内的试玩计时（秒）。
  # 2026-11-06 用户要求：15.5 → 19（区间 18~20 取中值）。背景：11-05/11-06 两天
  # 试玩奖励页缺失严重（11-06 全 43 支里 34 支 ✗，仅「王」账号 9/9 到账），
  # 怀疑一是「等不满 15s 结算没触发」，二是账号维度限流。先抬到 19s 做 A/B：
  # 若 ✗ 比例无明显下降，说明与等待时长无关（回到账号/创意维度排查），
  # 可回退此值（15.5 = 实测达标的下限）。
  # ⚠️ 这是 sleep 时长，点击后另有 pause=1.5，页面实际停留 ≈ 20.5s。
  ad_minigame_wait: 19
  # 最多点几次「返回」退出。实测需 2 次（授权页→奖励页→任务中心），留 3 次余量。
  ad_minigame_backs: 3
  # 2026-10-22 N2：试玩退出后**已用 dump 确认回到任务中心**时，跳过 _close_ad。
  # 背景（10-22 觅夏 9 支实测）：链路末尾日志已打「已回到任务中心（dump 确认）」，
  # 代码却仍完整跑 _close_ad —— 页面根本没广告可关，top-strip OCR 读不到 →
  # 落兜底轮询，白花 4.3~13.3s（p50 4.50 / 均值 7.19）。跳过不改变任何成功判据。
  # false = 回退旧链路（继续跑一遍 _close_ad 做二次确认）。
  ad_minigame_skip_close: true
  # 2026-11-10 用户需求：**跳过试玩链路**（模拟器没装微信，跳小程序必失败）。
  # 背景：试玩广告点「点击进入」→ 微信小程序授权页 → 模拟器无微信 → 白等
  # ad_minigame_wait(19s) 且拿不到奖励页（11-08/11-09 实测奖励页 0/9、电量不到账）。
  # true = 命中试玩落地页只点「返回」退回任务中心，**不点「点击进入」**
  #        （单支代价 27~38s → 约 4s）→ 重看一支（换创意）；
  #        重看仍是试玩 → 本支放弃，**不计失败**（避免 3 连败弃权级联），
  #        剩余支数由后续轮换圈 / 本轮回补（rotate_backfill）自然再试；
  #        连续 3 次跳过则移出窗口进回补，防「永远只遇到试玩」空转。
  # false = 回退旧行为（点进去等 19s 走完整试玩链路）。
  ad_minigame_skip: true
  # 广告观看间隔 CD（秒）（F10：单次任务中心会话内连看广告的原地等待间隔，
  # 与旧“逐次进出”轮转保持相同的观看节奏，防风控）
  ad_cooldown: 60
  # 广告阶段模式（2026-09-16 引入，2026-09-26 演进为滑动窗口）：false=同机连看
  # （旧行为，每台进台一次按 CD 连看 target 支，~89s/支）；true=滑动窗口轮询——
  # 固定 ad_rotate_group（默认 3）台窗口 + 补位队列，某台出窗（配额满/连败 3 次）
  # 立即从队列补位进窗（排窗口尾部），窗口保持满员；仅剩 1 台且无待补时回落
  # 同机连看。每台每轮看 1 支，靠切换吸收 CD（u2 实测 ~48-49s/支）。
  # --rotate 命令行可强制开启。默认 false 不改变现有 bat 行为。
  ad_rotate: false
  # 滑动窗口窗口台数（2026-09-16 组制轮询 → 2026-09-26 滑动窗口）
  # P0（2026-10-20 改 3 → 5）：实测窗口 3 台时，10 台会被切成 3/3/3/1 四批
  # **串行**推进 —— 前 3 台走满 10 圈才出窗（日志实测 10:19:29 开轮换、
  # 10:32:18 代柯才满 = 整整 13 分钟），最后一批只剩 1 台落单：
  # 单台轮转间隔 = 1×30s < ad_cooldown 60s ⇒ 每支硬等满 60s，连看 7~8 支
  # ≈ 450s/账号，四账号合计 ≈ 30min/天（10-20 30 次、10-19 29 次，是既有缺陷）。
  # 窗口 5 台 ⇒ 间隔 5×30s=150s，远大于 CD，落单延迟到每批末尾且剩余支数很少。
  # 进台总次数不变（轮换模式下每支广告本来就要进台一次），无隐性成本。
  # ⚠️ 观察判据：跑批后看「广告 CD 60 秒」次数/账号（基线 7.5 次 → 目标 ≤3）。
  # 若仍偏多，下一步改 10（全局同步轮转，间隔 300s）；一键回退改回 3。
  ad_rotate_group: 5
  # 回落同机连看前补等 CD（2026-10-31 新增）：窗口缩到 1 台且无待补时，
  # `_watch_ads_session` 只保证「支与支之间」等到 t_close+ad_cooldown，
  # **首支没有门槛** → 前一支刚关就回落必撞 60s CD，广告页不出 → 3 连败弃权。
  # 实测（10-31 03:44 觅夏号·游迦）：上一支 03:44:11 关闭 → 03:44:12 进会话
  # → 03:44:17 点广告 → 3 连败 → 8/10 收工，白烧 1 分钟还丢 2 支。
  # true = 回落前补等「上一支剩余 CD」（只补不足部分，≤ad_cooldown 秒）。
  # false = 回退旧行为（立刻进会话，撞 CD 就认）。
  rotate_cd_gate: true
  # 本轮弃权回补（2026-11-06 用户需求：优先保障电量到账）。
  # 旧行为：某台连败 3 次（广告打不开 / 播完但屏幕 X/10 不前进）→ `_rotate_out`
  # 把它移出窗口后**没有任何回访路径**，剩余支数直接白丢。实测 11-06 唐灵·古禹
  # 屏幕 2/10 vs 进程口径 3/10，连 3 次重锚未到账即弃权，缺 8 支。
  # true = 弃权台记入本轮回补队列，等**整轮窗口跑完**后逐台同台连看补完；
  #   回补阶段不做屏幕真值重锚（done 单调递增 ⇒ while 必然收敛，无死循环），
  #   每台只补一次（不递归），首支前按该台 last_ts 补 CD 余量。
  # false = 一键回退旧行为（弃权即放弃，照常记「连败3次弃权，余N支未看」）。
  # ⚠️ 代价：最坏情况每台多花「剩支数 × 单支墙钟」，换来的是到账电量。
  rotate_backfill: true
  # 签到奖励广告（2026-09-16）：签到成功后浮层内「看广告 +⚡」按钮 → 看一次
  # 15s 广告拿奖励。true=开启（仅当日真正签到时触发，已签到跳过）；失败只记
  # 日志不阻断签到/反馈/主广告。false=回退旧行为（不看奖励广告）。
  signin_ad: true
  # 签到链路校验（2026-10-28 用户需求）：补上「签到/签到奖励广告」的**结果**检测 ——
  # 以前全流程的检测都只覆盖任务中心广告，签到这条支线只证明「动作做完了」：
  #   D1 `_verify_signin_effective`：签完回读任务行，应变成 n/n（用户截图确认终态
  #      是「每日签到 1/1 + 连签50天」）。读到 0/n 才判未生效；**读不到不判**
  #      （新版式任务行常被顶出可见区，坑 17，否则全是误报）。
  #   D2 `_verify_signin_ad_reward`：点「看视频 + 10」前读一次电量、关闭后读一次，
  #      差值 ≥ signin_ad_reward 才算到账（与坑 25「屏幕真值重锚」同一思路 ——
  #      任务中心广告有到账核对，签到广告此前一次都没有）。读数缺失则跳过不判。
  #   D3 点击被吞 → 重取按钮补点一次，仍失败才告警。
  # 成本：+3 次读屏/台（约 2~3s），40 台/天 ≈ 2min；告警走 watch.signin_verify，
  # 连续 watch.task_fail 次才推，不刷屏。false = 三项全部关闭，行为回到 10-28 之前。
  signin_verify: true
  # 签到奖励广告的承诺到账值（浮层按钮文案「看视频 + 10」→ 10）。
  # 差值为 0 或负数即判「未到账」，进连续计数告警。
  signin_ad_reward: 10
  # 宽限期重读（2026-10-29 首日实测后补）：10-29 的 40 次校验里 15 次「恰好 +0」，
  # 均匀散在 10 台机器人上、播放时长都达标（16.5s）⇒ 更像电量显示未刷新
  # （任务中心是 H5，电量接口轮询缓存几十秒）而非真漏账。故首次 +0 不直接判死：
  # 等 signin_ad_grace 秒重读，最多 signin_ad_reread 次；重读拿到 +10 记
  # 「延迟到账」按通过处理，仍 +0 才告警。代价只在失败分支（+2s × ~15 次 ≈ 30s/天）。
  # 跑一天看三档比例：延迟档多 = 判据问题（已修）；确实未到账仍多 = 真漏账。
  signin_ad_grace: 2.0
  signin_ad_reread: 1
  # 试玩广告「奖励页」计数（2026-11-03，坑 44）：坑 41 已证「奖励页出现 ⇔ 电量
  # 到账」（全期 26 样本零例外：有奖励页 18/18 到账、无奖励页 0/8）。自 2026-11-01
  # 03:39 起试玩创意整体不出奖励页；11-03 试玩占比更从 11-02 的 0% 跳到 ~70%
  # ⇒ 时间照花（~21s/支）、电量 0，而此前日志里完全看不到损失。
  # 现改成：每支试玩链路末尾记一次 ✓/✗（零额外读屏，复用退出循环里已有的
  # dump 快照）+ 汇总输出「试玩广告：n 支，奖励页 ✓x / ✗y」+ 连续 N 支 ✗ 告警
  # （N 复用 watch.task_fail，实际 3）。⚠️ ✗ 只代表「没读到奖励页关键词」，
  # **是否真到账仍以 D2 电量差为准**，别拿它做补偿/重看决策。
  # 回退：false → 完全不计数、不告警（行为回到 11-03 之前）。
  minigame_reward_track: true
  # 告警降噪（2026-11-03 用户反馈）：11-03 一天推了 7 条「连续 3 支试玩广告无
  # 奖励页」，同一个已知投放问题刷屏没意义。true → 本轮跑批只在**第一次**达标时
  # 推一条，之后只计数不推（日志与汇总里的 ✓/✗ 计数照常）。
  # 注意与 notify.dedup_window（默认 30 分钟滚动限频）互补：那个是限频，这个是
  # 「整轮只推一次」。false → 回到旧行为（每连续 3 支就推一条）。
  minigame_reward_alert_once: true
  # 广告关闭重试轮数（广告时长不固定，播完才出现关闭按钮，需轮询）
  ad_close_retries: 12
  # F6（2026-09-10）：第 4 步"盲点超限改物理 BACK"的连续 BACK 次数上限。
  # 广告页 1 次 BACK 即回任务中心，留 2 次容错；超过即放弃本次关闭并返回
  # False（交 run_all 失败计数 + _safe_back_to_robot_list 复位）——防判定
  # 失灵时无限 BACK 一路退出 QQ（11:58 实测连按 10 次退到手机桌面）。
  ad_close_max_backs: 3
  # #2（2026-09-10）：关闭广告时 uiautomator dump 的超时（秒）。默认 2.5s 且不重试，
  # 压低视频/动画期每次查找的等待（原 DUMP_TIMEOUT 4s×2≈8s 是日志超时浪费主因）。
  # 传 None 则退回全局 DUMP_TIMEOUT=4s。
  ad_close_dump_timeout: 2.5
  # B（2026-09-11）：关闭按钮 tap 后的"沉降"等待（秒），让关闭动画/任务中心重载播完再确认，
  # 避免动画期 OCR/dump 撞超时（代柯 32s 实测）。快路径机器人会多等该秒数。
  # A8（2026-09-12）：2.0 → 1.0 —— 记忆 09-11 实测中位耗时未因 2.0s 再降
  # （11.3→11.4s），仅最差 31.7→27.4s 有改善；且 A2 截图缓存上线后确认路径
  # 读屏更快，1.0s 沉降 + 更快读屏的组合预期足够。真机若发现关闭后频繁撞
  # dump 超时/误判，改回 1.5-2.0。
  ad_close_settle: 1.0
  # P6（2026-10-28）：砍掉 tap 后的第一段固定空等（1.5s → ad_close_tap_pause）。
  # 实测依据（10-28 全场 408/408 支走顶条快检直关）：关闭链 p50 3.60s =
  #   tap(pause=1.5) + sleep(settle=1.0) + 全屏确认(~1.2)
  # 用户肉眼确认「关掉广告画面后，程序还要干等约 2s 才开始退台」。这两段共
  # 2.5s 纯空等 × 408 支 ≈ 17min/天。本次只砍第一段（1.5 → 0.35），保留
  # settle=1.0 作为页面就绪余量，总沉降仍 1.35s；若 1.35s 不够，确认链的
  # gap 重试（1.2s）会兜住，最坏 3.95s（比现状仅 +0.25s）。
  # 观测口径：日跑批 grep「直关确认首次未命中」——该条数 / 关闭链条数 就是
  # 重试率；若持续 <5% 说明沉降还能再压。
  # 回退：ad_close_fast_settle: false → 恢复 pause=1.5。
  # 注：**不要改成 dump 探针轮询**（同日试写过并否决）——u2 的 dump(timeout)
  # 不吃 timeout，切到任务中心后是 WebView 实测 1.89s，探针最后一次采样必然
  # 慢于它替代的 sleep，结构性负优化（MEMORY 坑 20）。
  ad_close_fast_settle: true
  ad_close_tap_pause: 0.35
  # P8（2026-10-29）：退穿自愈 —— BACK 把 QQ 退出到桌面/系统设置后自动 am start 拉回。
  # 事故依据（10-29 凌津渡实测，38/100 支广告报废）：段3「点行」被 QQ 吞掉 →
  #   主壳切到「动态」tab（被吞的结果，不是原因）→ `_safe_back_to_robot_list`
  #   按觅夏防御（09-30）继续物理 BACK → QQ 已无内部可退的层，BACK 等于退出 App
  #   → 桌面 launcher → 系统设置 → 之后 9 台机器人每次导航都在桌面上执行，
  #   全部「6 次物理返回后仍未到 QQ 主界面」→ 连环弃权。
  # 判据：读前台包名（`dumpsys activity activities` 的 topResumedActivity），
  #   不是 com.tencent.mobileqq 就停止 BACK、`am start` 拉回；拉不回则先 HOME
  #   清掉压顶 task 再 start（实测 task 已存在时 am start 只会 "brought to the
  #   front" 而前台仍是压顶的 Settings）。
  # 成本：只在兜底路径（安全返回/BACK 链）付一次 dumpsys ≈ 0.1~0.3s，成功路径 0。
  # 观测口径：日跑批 grep「安全返回前置检查：QQ 已不在前台」「脱离 QQ」「QQ 已拉回前台」。
  # 回退：escape_recover: false → 行为回到 10-29 之前（纯物理 BACK）。
  escape_recover: true
  # 自愈轮数（am start + HOME + 复核 算 1 轮）。设太大只会在真·读屏盲区里空转。
  escape_recover_tries: 2
  # F1（2026-11-02）：am start 拉回 QQ 后的「就绪等待」。
  # 事故依据（11-02 首轮，唐灵 3 台 + 凌津渡整号报废）：
  #   广告未打开(坑42) → 退台三层失败 → 滑顶 8 次(15s) → 退穿到桌面 →
  #   am start 拉回(前台=QQ) → **仅 0.7s** 后判「未能确认在机器人列表」→
  #   再 6 次物理 BACK → 又退穿 → 循环；当天「安全返回」被调用 10 次全失败。
  # 根因：`ui.nodes()` 有 0.8s TTL 缓存，而 `am start` 走 adb shell、不经过
  #   UI 类 → 不失效缓存 → 判据吃的是「桌面那次 dump」→ 认为不在 QQ 主壳
  #   → 兜底继续物理 BACK，而 QQ 在联系人/消息页按一次 BACK 就是退出 App。
  # 做法：拉回成功后强制失效缓存 + 轮询「QQ 主壳进树」≤ 本值秒；超时只打
  #   warning 并交回调用方（**不判失败**，保持旧兜底语义）。
  # 成本：仅异常分支；命中即返回（预期 0.2~0.6s），成功路径零开销。
  # 回退：am_start_settle: 0 → 不等（等价旧行为）。
  am_start_settle: 3.0
  # F3（2026-11-02）：「滑动到任务中心顶部」前置校验 —— 不在任务中心就不滑。
  # 事故依据：11-02 退台第 2 轮兜底在广告/子页上盲滑 8 次（白烧 15s），
  #   把页面推得更远，随后 3 次 BACK 直接退穿。滑顶只在任务中心有语义。
  # 判据并集：_page_tc ∪ 外壳特征(收支详情/当前电量/去充电) ∪ 「每日签到」
  #   ∪ 「看视频赚电量」（任务中心滚下去时只有广告行标题还在屏）。
  #   ⚠️ 刻意不收「任务中心」四字 —— 个人资料卡也有该入口，会被误判。
  #   全无才跳过；读屏异常/Mock 一律按「在任务中心」（宁可多滑）。
  # 回退：tc_scroll_guard: false → 永远滑（旧行为）。
  tc_scroll_guard: true
  # P5（2026-09-12 晚）：直关 tap 后的确认重试。关闭动画/任务中心重载期单次确认
  # 会误判"直关未生效"而白走 7-12s 兜底（21:00 场 33/33 实锤，肉眼看广告当场已关）。
  # 确认失败后等 ad_close_confirm_gap 秒再重试，共 1+ad_close_confirm_retries 次
  # 确认；全部失败才走 Badcase 巡检 + 兜底。设 retries=0 可回退旧行为。
  ad_close_confirm_retries: 1
  ad_close_confirm_gap: 1.2
  # E 优化（2026-09-14）：广告等待窗口内预定位「关闭广告」按钮。
  # 等待进行到 ad_prefetch_at 秒时用顶条 OCR 预定位并缓存坐标（不点击，tap
  # 时机不变）；_close_ad 在「步骤 0 任务中心守卫通过」的前提下直接用缓存坐标
  # tap，省掉 dump 2.5s 白等 + 重新 OCR 定位（~3.5-4.8s/次）。预定位读不到
  # （插屏/特殊版式）自动走原链。false = 回退旧行为。
  ad_prefetch_pos: true
  # P0-b（2026-10-19）：预定位时点 10.0 → 13.0 —— 播放到 10s 时广告的
  # 「跳过/关闭」按钮多数还没渲染出来（10-19 实测 447 支里 269 支预定位命中
  # = 60%），未命中的 178 支要白走 _close_ad 的 dump 定位段（实测 2.3s/次）。
  # 后移到 13.0s（播放 p50 16.0 / p90 16.8，仍留 ~3s 余量）让按钮充分出现；
  # 触发条件同步放宽为 wait > prefetch_at + 1.0（原 +2.0），保证 15~17s 全窗覆盖。
  # 配套 P0-a：_ad_play_and_close 已把预定位的 OCR 耗时从等待窗里扣掉，
  # 时点后移**不会**让总观看时长变长。
  ad_prefetch_at: 13.0
  # 预定位坐标的保鲜期（秒）：从预定位到 tap 超过该值即弃用走原链。
  ad_prefetch_ttl: 20.0
  # P1-b（2026-10-20）：无预定位时也用顶条 OCR 前探一次关闭按钮。
  # 背景：10-20 全场 448 支里预定位命中 290 支（64.7%），未命中的 158 支
  # 没有缓存可用 → 只能走「全屏守卫 1.68s + uiautomator 1.89s」，
  # 关闭链均值 5.90s；而预定位命中的走顶条快检只要 4.31s。
  # 顶条 OCR（_ad_close_pos）与 E1 用同一个**正向判据**：读到「关闭广告/
  # 跳过/取消」才放行点击，任务中心顶栏实测 0/10 误报 ⇒ 可安全前置于
  # 全屏守卫。读到就直接关（省 3.57s），读不到原样落回步骤 0 链路。
  # tc_seen=True（前置 OCR 已读到任务中心特征）时不探，避免纯浪费 1.6s。
  # 预期收益 ≈3.7 min/天；false = 回退「仅预定位命中才快检」的纯 E1 行为。
  ad_close_ocr_first: true
  # N3（2026-10-22）：顶条关闭按钮快检**先用 dump、OCR 兜底**。
  # 真机取证（P-slow 探针，视频播放中取样）：广告页「关闭广告」是有 text 的
  # 真实节点 '关闭广告'(32,104)-(250,196)，u2 dump 只要 0.05~0.06s；而顶条
  # OCR（_ad_close_pos）要 ~1.5s，还会漏读 —— 生产里 43~58% 的广告因此落到
  # 「全屏 OCR 守卫 1.68 + uiautomator 定位」的 7.2s 慢路径。
  # 慢路径的根因**不是 ✕ 没渲染**，是定位手段选错（同一节点 dump 一读就有）。
  # 命中即 _tap_node（F11 节点点击）；未命中只多花 0.06s 就回落原 OCR 链路。
  # false = 回退为「纯 OCR 快检」（本项上线前的行为）。
  ad_close_dump_probe: true
  # N4-a（2026-10-22）：点开广告后**校验广告页真的打开了**，没打开就别白等 16s。
  # 背景：探针连续复现「_watch_ad_once 返回 True、可疑=True、配额不动」——
  # 广告行点了根本没打开广告（无 fill / 点击被吞），而 _close_ad 的 OCR 守卫
  # 看到任务中心就返回成功，于是白等满一个等待窗。生产靠坑 25 屏幕真值重锚
  # 兜住不丢配额，但时间照赔。
  # 判据：4.0s / 6.0s 两次 dump 都稳定读到任务中心特征、且全程没有广告页特征
  # → 判定没打开（任一环节不确定都按「已打开」保守处理，绝不在不确定时误判）。
  # 两个时点都在 ad_wait 等待窗**之内**，成功路径不增加总时长。
  ad_open_guard: true
  # 判定时点（秒，相对点开广告）。落在等待窗内 = 免费。
  ad_open_guard_at: [4.0, 6.0]
  # 判定「没打开」后**重取行节点补点一次**（与「发消息」被吞同源，补点可救回）。
  ad_open_retry: true
  # N4-b（2026-10-22）：关闭广告前若顶条仍显示「倒计时 Ns」，先补等 N+0.6 秒。
  # 证据：t≈17s 时倒计时还剩 5s，此刻点「关闭广告」会弹
  # 「至少需要观看15秒视频才能获得有效奖励哦」→ 该支白看，且多花 11.9s 走弹窗。
  ad_countdown_wait: true
  # 补等上限（秒）：防异常长的倒计时把整轮拖住。
  ad_countdown_max: 12
  # 2026-09-14：_back_at_taskcenter 三信号免 dump 快速通道 —— OCR 命中任务中心
  # 特征 + 顶条无关闭按钮 + 顶条无覆盖层词（问卷+资料卡）→ 直接判 True 跳过
  # dump。dump 超时路径旧逻辑本就信任 OCR（streak>0 分支），本开关只是把
