  # false = 回退严格 dump 确认链。
  tc_confirm_skip_dump: true
  # 【已实测否决 2026-10-19 —— 别再试这条路】
  # 曾试过「关闭确认走 u2 dump 快通道」取代全屏 OCR。判据本身是对的（真机三场景
  # 全 PASS：机器人列表 False / 任务中心 True / 签到浮层 True），但**耗时反向**：
  #   u2 dump 在原生列表页只要 0.09s，但在任务中心 **WebView** 上要 1.89s
