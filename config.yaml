# ============================================================
# 自动签到 + 看广告 配置
# 目标: QQ (com.tencent.mobileqq) 机器人任务中心
# 注意: 所有坐标基于固定的模拟器分辨率，改动分辨率需重新抓取
# ============================================================

device:
  # MuMu 模拟器 adb 序列号
  # MuMu 有两个 adb 入口：
  #   - emulator-5554：MuMu 底层 QEMU 内核，adb server 自动发现，daemon 重启自动重连（稳定，推荐）
  #   - 127.0.0.1:16384：MuMu 网络 adb 转发端口，需手动 `adb connect`，daemon 重启会丢
  # 实测本机 MuMu（机型模拟小米 12 / cupid）稳定入口为 emulator-5554
  udid: "emulator-5554"
  # 感知层后端（阶段2 2026-09-15）：
  #   adb = 原 adb uiautomator dump（默认，2.4-3.8s/次）
  #   u2  = uiautomator2 3.x 设备端常驻 agent（实测中位 94ms，42.6x 提速）
  # 互斥警告：u2 agent 常驻时 adb uiautomator dump 100% 被 SIGKILL(rc=137)。
  # u2 进程退出时自动 stop agent 让出通道；若手动 kill 进程残留 agent，
  # 执行 `py -3.13 -m uiautomator2 -s emulator-5554 stop` 或重启模拟器。
  # 阶段1 探针：scripts_test/probe_u2.py；设备端资源安装：`py -3.13 -m uiautomator2 init -s <udid>`
  backend: "u2"
  platform: "Android"
  platformVersion: "15.0"        # MuMu 12 = Android 15
  noReset: true                  # 不重置应用数据（保持已登录状态）

app:
  package: "com.tencent.mobileqq"
  activity: "com.tencent.mobileqq.activity.SplashActivity"

# ------------------------------------------------------------
# 流程控制
# ------------------------------------------------------------
workflow:
  # 每个机器人看广告的次数
  ad_times_per_robot: 10
  # 看广告时在广告页停留的随机区间（秒）：
  # 15-17s 覆盖 ≤15s 视频广告 + 页面加载延迟（2026-09-13 用户确认第三轮收紧；
  # 原 20-23s → 18-20s → 16-18s → 15-17s），等待结束进入 _close_ad：
  # uiautomator 优先直关，视频未播完时 dump 有界失败后转 OCR 正向定位。
  # ⚠️ 已贴 15s 视频底线：真机验证看广告计数仍增长方可保留，异常则回调 16-18。
  ad_wait_min: 15
  ad_wait_max: 17
  # 广告观看间隔 CD（秒）（F10：单次任务中心会话内连看广告的原地等待间隔，
  # 与旧“逐次进出”轮转保持相同的观看节奏，防风控）
  ad_cooldown: 60
  # 广告阶段模式（2026-09-16 引入，2026-09-26 演进为滑动窗口）：false=同机连看
  # （旧行为，每台进台一次按 CD 连看 target 支，~89s/支）；true=滑动窗口轮询——
  # 固定 ad_rotate_group（默认 3）台窗口 + 补位队列，某台出窗（配额满/连败 3 次）
  # 立即从队列补位进窗（排窗口尾部），窗口保持满员；仅剩 1 台且无待补时回落
  # 同机连看。每台每轮看 1 支，靠切换吸收 CD（u2 实测 ~48-49s/支）。
  # --rotate 命令行可强制开启。默认 false 不改变现有 bat 行为。
  ad_rotate: false
  # 滑动窗口窗口台数（2026-09-16 组制轮询 → 2026-09-26 滑动窗口；10 台全量推荐 3）
  ad_rotate_group: 3
  # 签到奖励广告（2026-09-16）：签到成功后浮层内「看广告 +⚡」按钮 → 看一次
  # 15s 广告拿奖励。true=开启（仅当日真正签到时触发，已签到跳过）；失败只记
  # 日志不阻断签到/反馈/主广告。false=回退旧行为（不看奖励广告）。
  signin_ad: true
  # 广告关闭重试轮数（广告时长不固定，播完才出现关闭按钮，需轮询）
  ad_close_retries: 12
  # F6（2026-09-10）：第 4 步"盲点超限改物理 BACK"的连续 BACK 次数上限。
  # 广告页 1 次 BACK 即回任务中心，留 2 次容错；超过即放弃本次关闭并返回
  # False（交 run_all 失败计数 + _safe_back_to_robot_list 复位）——防判定
  # 失灵时无限 BACK 一路退出 QQ（11:58 实测连按 10 次退到手机桌面）。
  ad_close_max_backs: 3
  # #2（2026-09-10）：关闭广告时 uiautomator dump 的超时（秒）。默认 2.5s 且不重试，
  # 压低视频/动画期每次查找的等待（原 DUMP_TIMEOUT 4s×2≈8s 是日志超时浪费主因）。
  # 传 None 则退回全局 DUMP_TIMEOUT=4s。
  ad_close_dump_timeout: 2.5
  # B（2026-09-11）：关闭按钮 tap 后的"沉降"等待（秒），让关闭动画/任务中心重载播完再确认，
  # 避免动画期 OCR/dump 撞超时（代柯 32s 实测）。快路径机器人会多等该秒数。
  # A8（2026-09-12）：2.0 → 1.0 —— 记忆 09-11 实测中位耗时未因 2.0s 再降
  # （11.3→11.4s），仅最差 31.7→27.4s 有改善；且 A2 截图缓存上线后确认路径
  # 读屏更快，1.0s 沉降 + 更快读屏的组合预期足够。真机若发现关闭后频繁撞
  # dump 超时/误判，改回 1.5-2.0。
  ad_close_settle: 1.0
  # P5（2026-09-12 晚）：直关 tap 后的确认重试。关闭动画/任务中心重载期单次确认
  # 会误判"直关未生效"而白走 7-12s 兜底（21:00 场 33/33 实锤，肉眼看广告当场已关）。
  # 确认失败后等 ad_close_confirm_gap 秒再重试，共 1+ad_close_confirm_retries 次
  # 确认；全部失败才走 Badcase 巡检 + 兜底。设 retries=0 可回退旧行为。
  ad_close_confirm_retries: 1
  ad_close_confirm_gap: 1.2
  # E 优化（2026-09-14）：广告等待窗口内预定位「关闭广告」按钮。
  # 等待进行到 ad_prefetch_at 秒时用顶条 OCR 预定位并缓存坐标（不点击，tap
  # 时机不变）；_close_ad 在「步骤 0 任务中心守卫通过」的前提下直接用缓存坐标
  # tap，省掉 dump 2.5s 白等 + 重新 OCR 定位（~3.5-4.8s/次）。预定位读不到
  # （插屏/特殊版式）自动走原链。false = 回退旧行为。
  ad_prefetch_pos: true
  ad_prefetch_at: 10.0
  # 预定位坐标的保鲜期（秒）：从预定位到 tap 超过该值即弃用走原链。
  ad_prefetch_ttl: 20.0
  # 2026-09-14：_back_at_taskcenter 三信号免 dump 快速通道 —— OCR 命中任务中心
  # 特征 + 顶条无关闭按钮 + 顶条无覆盖层词（问卷+资料卡）→ 直接判 True 跳过
  # dump。dump 超时路径旧逻辑本就信任 OCR（streak>0 分支），本开关只是把
  # 「白等 2.5s 再得出同一结论」提前；误判兜底 = 信号任一异常落回 dump 严格链。
  # false = 回退严格 dump 确认链。
  tc_confirm_skip_dump: true
  # 2026-09-29 P1 导航等待提速：实测（探针 probe_exit_timing.py 3 trial）层3
  # BACK 后 0.07-0.08s 列表即可被强判据检出、层1/2 列表校验恒不命中 —— 退台
  # 层间固定 pause+1.2s 盲等改为 pause(0.8-1.2)+立即单次强校验（判据/层数/兜底
  # 全不变，退台 8.9s → ~3.5s）；进台 wait_for 轮询间隔 1.0→0.5s（retries 加倍，
  # 总窗口不变）。false = 一键回退旧行为。
  nav_fast_wait: true
  # 2026-09-29 P1b 进台点击 pause 收紧（仅进台，全局 timing.click_min/max 不动）：
  # 诊断实测（09-29 王 92 轮 / 唐六爻 91 轮进台打点）——进台 9.5s 里 6.75s（70%）
  # 是「点机器人行 / 点发消息 / 点个人」三处 _tap_node 后的固定 pause 空等，其
  # 分布形状完全等于 uniform(1.5, 3.0)（段3/4/5 最小值恒卡 1.6-1.8s），而紧随
  # 其后的 wait_for 才是真就绪判据。故把进台三处 pause 改由本旋钮取值
  # （默认 0.5-0.9s），pause 收窄的秒数折成额外 wait_for 轮询 → tap 后**总窗口**
  # 不短于旧行为，慢页最坏等待不缩短。设回 min:1.5 / max:3.0 即完全回退。
  # ⚠️ 仅作用于 _enter_taskcenter 三处点击；签到/反馈/关广告/退台节奏零变化。
  enter_tap_pause_min: 0.5
  enter_tap_pause_max: 0.9
  # 2026-10-08 P3：进台「TC 探测 + 配额读屏」合并。段5 就绪轮询本就每 0.5s 取一次
  # ui.nodes() 快照判「任务中心特征」；本合并让该**同一份快照**顺手解析广告行 X/Y
  # （_ad_ratio_from_snapshot）：命中即同时证明「任务行已渲染」+ 拿到配额基数 →
  # 跳过 段6 独立配额读屏（实测恒定 ~1.55s / 2 次 dump，且其 max_scroll=6 的 swipe
  # 会把刚进的任务中心页面**滚走**）。**零额外 dump**：不新增任何取屏，快照解析打空
  # 即回落 段6 原链路（慢加载/心动卡促销/错页全由原有链兜住）。
  # ⚠️ 曾被实测推翻的一版设计：进台一开始单发一次「免滚探针」(_read_ad_ratio
  #   (scroll=False)，max_scroll=0 只读首屏)。段5 中位 ~1.95s 是 H5 **真实渲染等待**，
  #   探针在页面渲染前必然打空 → 只会白加一次 dump。故改为复用 段5 快照。
  # false = 一键回退旧行为（段5 走 _find 轮询、段6 独立读屏）。
  tc_ready_by_quota: true
  # 2026-10-08 P1：进台**落点断言** —— 段5 探不到任务行时做一次 OCR 判别：
  #   读到任务中心特征        = H5 慢加载 → 放行（与旧行为一致）；
  #   读到错页特征（_LANDING_WRONG_KEYS = 发送/语音通话/QQ空间/资料卡/相册/
  #   听听）= 落错页（聊天页/资料卡）→ 判进入失败，交上层复位重试，
  #   不再白跑一轮 签到+反馈+广告（10-04 古禹静默失败，~4min）。
  # 为什么不用「必须命中任务中心特征」：实测 91 次兜底分支里只有 6 次是真错页，
  # 其余 85 次是慢加载但最终成功 → 强断言会误伤那 85 次，反而更差。
  # 成本：只在 1.1% 的异常分支上付一次 OCR；成功路径零开销。false = 回退旧行为。
  enter_landing_assert: true
  # 2026-10-12 P0：段5「提前 OCR 复核」自适应 —— 官方新版式（任务中心首屏插入
  # 心动卡促销卡）下 dump 免滚动单快照**结构性**读不到任务行（实测 10-11 起
  # 段5>4s 占比 7%→100%、段5 中位 1.9s→7.9s、进台中位 6.0s→11.5s，372 台
  # ≈ +30min/天），而 OCR 全屏扫描仍读得到。旧链在此版式下必然「空轮询满
  # taskcenter_wait + 两次全屏 OCR」＝纯粹空耗。
  # 启用后：连续 2 台进台（内置 TC_DUMP_MISS_TRUST）的 dump 轮询**全程打空**
  # 才认定 dump 不可靠；此后每台进台在第 enter_early_ocr_polls 轮仍打空时立即做
  # **一次**全屏扫描（四合一：任务中心 / 关闭按钮 / 覆盖层 / 心动卡促销）——
  # tc 命中即放行、promo 命中即上滑重探、全空则继续轮询并走原兜底。
  # ⚠️ 旧版式与慢加载（dump 会命中）下计数立即归零 → **提前复核从不触发**，
  # 成功路径零额外开销。若实测提前复核命中率低（页面尚未渲染完），调大
  # enter_early_ocr_polls 即可；false = 一键回退旧行为。
  enter_early_ocr: true
  # 提前复核前先等待的轮数（每轮 0.5s）。默认 4（≈2.0s）—— 覆盖实测页面渲染
  # 耗时上限（10-09/10-10 dump 命中中位 1.9s），避免在渲染完成前白扫一次。
  enter_early_ocr_polls: 4
  # 2026-10-12 P1（方案 E）：段5 dump 就绪判据**对齐 OCR 判据** —— 在「任务行」
  # （每日签到 / 任务中心 / 看广告 / 获取随机 / 看视频赚电量）之外，追加「TC 外壳
  # 特征」（flow._TC_SHELL_KEYS = 收支详情 / 当前电量 / 去充电）。
  # 实测依据（真机 3/3 机器人，probe_e3_firstseen）：官方新版式下任务行被心动卡
  # 促销卡**顶出可见区**，在 a11y 树里 6.5s 窗口内**一次都没出现**（结构性缺失，
  # 不是"慢"），而外壳特征 0.0~1.48s 即进树；且「收支详情」本就是 _TC_KEYS_OCR
  # 的成员（OCR 侧一直拿它当任务中心特征），此前只有 dump 侧漏了 → 本项即口径对齐。
  # 效果：段5 回到 ~1s 级且**零 OCR**（P0 的提前复核因 dump 命中而不触发，连带
  # 省掉其 ~1.8s/台）；E 与 P0 是分层关系：E 命中则 P0 静默，E 打空（未来版式再变）
  # 时 P0 仍在 2 台后接管兜底。
  # 慢加载 / 旧版式不受影响（新词表是旧词表的**超集**，只可能更早命中）；错页安全性
  # 不降级（命中仍要求 TC 特征词，机器人列表 / 资料卡 / 聊天页逐页取证 0 命中）。
  # false = 一键回退旧判据（只认任务行 + 广告行）。
  enter_ready_shell_keys: true
  # 2026-10-12 P2（方案 F）：OCR 取图**优先走感知后端原生通道** ——
  # u2 的 screenshot_pil（设备端 :9008 直取 PNG）实测 0.07~0.17s，对比
  # adb exec-out screencap 的 0.46~0.50s 快约 5x（probe_f_ocr.py 实测）。
  # 取图是全流程最高频 I/O（_dismiss_badcase / _close_ad / _fullscreen_scan* /
  # _ocr_find 全部经 flow._ocr_shot），省下的 ~0.4s 会按调用次数放大。
  # 图像尺寸与色彩空间与 adb 路径完全一致（1080x1920 RGB）。
  # 感知后端为 adb（无 screenshot_pil）/ 通道抛异常 / 返回 None → **自动静默
  # 回落 adb 原链路**，本旋钮只影响「是否优先尝试原生通道」。
  # false = 一键回退纯 adb 取图。
  ocr_shot_via_u2: true
  # 2026-10-08 P1：F9/坑 15 **让位后落点复核** —— 上滑让位改变列表版式，目标行
  # 可能被滚入吸顶分类栏下缘的回收残影槽位（坑 15：点该槽位坐标会命中分组头
  # → 列表被折叠 → 4 台连环弃权）。让位后用新 dump 复核「同名机器人行仍在 +
  # 仍在安全点击区(cy/y2<=TAP_Y_MAX) + 未贴吸顶栏」，任一不过则放弃本次点击交
  # 上层复位重试。仅「确实让位过」时付一次 dump；未让位的成功路径零开销。
  enter_landing_recheck: true
  # 2026-09-29 电量统计：每账号「本流程获得电量」= 第一台机器人首次进台读的
  # 「当前电量」→ 广告全部看完后补一次进台读的终值，差值计入汇总文件。
  # 结束快照需补一次进台（~20s/账号），主路径零额外读屏。false = 关闭统计。
  energy_stat: true
  # 2026-09-29 方案 A（游迦 9/10 虚报实锤）：连看会话末支「关闭路径可疑」
  # （_close_ad 未点到任何关闭按钮、仅凭 OCR 判已回任务中心）时，收尾 break
  # 前真实读屏复核配额，不符则按屏幕真值校准继续补看。正常关闭路径零额外
  # 读屏，不影响点击效率。false = 回退旧行为（不复核）。
  ad_end_verify: true
  # 2026-09-25 官方改版：问题反馈页需填写反馈内容才能提交。true = 启用自动
  # 反馈，内容为 5 位随机数；false = 回退旧行为（进页不填写直接返回）。
  # ⚠️ 官方按「账号+内容」去重（2026-09-26 用户实测：同账号内只要输入过一次，
  # 往后同内容全部被拒，toast「反馈内容重复了」不进 dump）→ 内容用 5 位随机数，
  # 每次生成前排除历史已用并追加记录到 logs/feedback_used.txt（跨进程永久不用）。
  feedback_fill: true
      # 机器人白名单（2026-09-09 用户维护）：仅对名单内昵称执行签到/问题反馈/看广告，
  # 其它一律跳过。QQ 中无法操作的（昵称重复：小麦1/小麦2、孤立“1”、内测中等）
  # 已排除在名单外。后续增删机器人直接编辑此列表；清空 = 不过滤（跑全部）。
  robot_whitelist:
    - 小麦
    - 尔尔
    - 席恩
    - 代柯
    - 游迦
    - 藤非
    - 古禹
    - 裴旖
    - 李宥恩
    - 黎小姐

# ------------------------------------------------------------
# 多账号自动切换（2026-09-24 新增）
# ------------------------------------------------------------
# 背景：一台模拟器里 QQ 登了 4 个账号（QQ 自带多账号列表），希望主流程
# 跑完一个账号自动切到下一个继续跑。
#
# 实测（2026-09-24 真机 dump + 截图，非臆测）：
#   切号路径 = 联系人页左上角「账户及设置」→ 侧栏「切换账号」→ 账号列表弹窗
#   → 点目标账号行；**免密秒切**，单次 ~8.5s，无密码/验证码（4/4 成功）。
#   - 账号列表每项为「昵称 + UIN」两行 dump 节点，**UIN 唯一稳定**；
#   - ⚠️ 列表顺序会变（当前登录账号置顶）→ 实现按 UIN 文本定位，禁止记坐标；
#   - ⚠️ 各账号机器人列表**不同**（唐灵 12 / 王 11 / 觅夏 13）→ 白名单
#     沿用上面 workflow.robot_whitelist（全局一份），该账号没有的名字自动跳过；
#   - ⚠️ 切号后**首次收集机器人必漏列表顶部若干行**（实测唐灵 7 vs 12、
#     觅夏 10 vs 13；数据加载期 Phase1「连续 2 屏不变」被误判为已到顶）
#     → 实现用「连续 2 次收集结果一致」判就绪后才采纳。
#
# 生效范围：**仅完整主流程**（py -3.13 main.py / --rotate）。--no-ad /
# --ad-only / --robots 手动指定 时保持单账号旧行为不变（一行代码回退：
# accounts.enabled: false）。
accounts:
  enabled: true
  # 切号成功后基础沉降（秒），再开始校验/收集（宁长勿短，防加载未完成）
  settle: 2.0
  # 单次切号失败的重试次数（网络/页面抖动自愈）
  max_retry: 2
  # 数据就绪判定：连续 N 次收集结果完全一致才采纳
  ready_stable: 2
  # 数据就绪判定最长等待（秒），超时用末次结果并告警
  ready_timeout: 120.0
  # 账号清单 —— 列表顺序即执行顺序
  #   nick = QQ 昵称（用于切号后校验）
  #   uin  = QQ 号（唯一标识，切号定位依据）
  list:
    - nick: "唐六爻"
      uin: "1000000001"
      enabled: true
    - nick: "王"
      uin: "1000000002"
      enabled: true
    - nick: "觅夏"
      uin: "1000000003"
      enabled: true
    - nick: "唐灵"
      uin: "1000000004"
      enabled: true

# ------------------------------------------------------------
# 点击频率控制（防风控）
# ------------------------------------------------------------
timing:
  # 两次点击之间的随机间隔区间（秒）
  click_min: 1.5
  click_max: 3.0
  # 页面切换后的等待时间（秒）
  page_wait: 2.5
  # A1（2026-09-12）：导航 tap 后「事件驱动等待」的目标超时（秒）——轮询
  # 页面真正到达目标状态即继续，页面就绪快时省时间（完整导航 50s→30s）。
  # 该值会自动 max(此值, page_wait)，保证最坏等待不短于旧固定等待。
  nav_wait: 8.0
  # 进入个人页后等待任务中心刷新的时间（秒）
  taskcenter_wait: 3.0
  # 广告页关闭后等待返回任务中心的时间（秒）
  # A 优化（2026-09-13 用户确认）2.0→1.0：关闭生效已有 settle+确认链路兜底，
  # 轮转循环随后还有配额检查；异常回调 2.0。
  ad_close_wait: 1.0
      
# ------------------------------------------------------------
# OCR 配置
# ------------------------------------------------------------
ocr:
  engine: "pytesseract"          # 目前仅支持 pytesseract
  tesseract_cmd: "C:\\Program Files\\Tesseract-OCR\\tesseract.exe"
  # 识别语言: chi_sim=简体中文, eng=英文; + 表示组合（中英混合识别）
  lang: "chi_sim+eng"
  # 识别文字时的置信度阈值（0~100），低于此值视为未命中
  confidence: 60
  # 识别时是否放大截图（提高小字识别率）
  scale: 2.0

# ------------------------------------------------------------
# 日志
# ------------------------------------------------------------
logging:
  level: "INFO"                  # DEBUG / INFO / WARNING / ERROR
  file: "logs/run.log"
